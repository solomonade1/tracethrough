name: Validate

# The fast, single-OS gate for the exact commit a release is built from: types, unit and integration
# tests, and a clean-consumer install of the packed npm tarballs (`pnpm smoke:packages`).
# release.yml calls it before versioning or publishing anything. The full cross-OS matrix lives in
# ci.yml, which desktop-release.yml calls for installer builds.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm typecheck

      - run: pnpm test

      # Packs core, node and next as `pnpm publish` would, installs the tarballs into a project outside the
      # workspace and exercises them. Never publishes anything.
      - name: Packed package smoke test
        run: pnpm smoke:packages
