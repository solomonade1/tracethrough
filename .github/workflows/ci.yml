name: CI

# Runs on pull requests only: branch protection requires an up-to-date, passing PR before merge, so a push
# to main would just repeat the same run.
on:
  pull_request:
  workflow_dispatch:
  # desktop-release.yml runs the whole matrix against the exact tagged commit before building installers.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox (and Electron's) relies on.
      - name: Allow Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Detection prefers the bundled build, so every OS tests against the same Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - run: pnpm typecheck

      - run: pnpm test

      # Packs core, node and next as publishing would and installs the tarballs into a clean project.
      - name: Packed package smoke test
        if: runner.os == 'Linux'
        run: pnpm smoke:packages

      - name: End-to-end (desktop app)
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: End-to-end (desktop app, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Build web mode UI
        run: pnpm --filter @tracethrough/desktop build:web

      # Proves the installer config still produces a working app; the e2e suite runs against the packaged exe.
      - name: Package (Windows, unsigned)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @tracethrough/desktop dist:dir

      - name: End-to-end (packaged Windows app)
        if: runner.os == 'Windows'
        env:
          TRACETHROUGH_E2E_EXECUTABLE: apps/desktop/release/win-unpacked/TraceThrough.exe
        run: pnpm exec vitest run --config apps/desktop/vitest.config.ts

  next-e2e:
    name: App Connect with Next.js (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm exec playwright install chromium --with-deps
      - run: xvfb-run --auto-servernum pnpm test:e2e:next

  # Real `next dev` / `next start` for each supported Next.js major. Slow, so it is a job of its own;
  # it is not (yet) a required check, see docs/RELEASING.md.
  next-matrix:
    name: Next.js matrix (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:next-matrix
