name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox (and Electron's) relies on.
      - name: Allow Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Detection prefers the bundled build, so every OS tests against the same Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - run: pnpm typecheck

      - run: pnpm test

      - name: End-to-end (desktop app)
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: End-to-end (desktop app, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Build web mode UI
        run: pnpm --filter @tracelens/desktop build:web

      # Proves the installer config still produces a working app; the e2e suite runs against the packaged exe.
      - name: Package (Windows, unsigned)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @tracelens/desktop dist:dir

      - name: End-to-end (packaged Windows app)
        if: runner.os == 'Windows'
        env:
          TRACELENS_E2E_EXECUTABLE: apps/desktop/release/win-unpacked/TraceLens.exe
        run: pnpm exec vitest run --config apps/desktop/vitest.config.ts

  next-e2e:
    name: App Connect with Next.js (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm exec playwright install chromium --with-deps
      - run: xvfb-run --auto-servernum pnpm test:e2e:next
