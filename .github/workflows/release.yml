name: Release

on:
  push:
    branches: [main]

# One release run at a time; never cancel a publish half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # push the "Version Packages" branch
  pull-requests: write  # open/update the "Version Packages" PR
  id-token: write       # npm provenance (and trusted publishing once configured on npmjs.com)

jobs:
  # The commit that is about to be versioned or published is checked again, including a clean-consumer
  # install of the packed tarballs, so a green PR is not the only evidence behind a publish.
  validate:
    name: Validate release commit
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Version or publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Typecheck, tests and the packed-package smoke test ran in the validate job above, on this exact commit.
      # With pending changesets: opens/updates the "Version Packages" PR.
      # When that PR is merged (no pending changesets): builds and publishes to npm.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: 'Version Packages'
          commit-message: 'Version Packages'
          # v2 creates a GitHub Release per package by default. Releases on this repo are the desktop
          # installers (desktop-release.yml), and "latest release" must keep pointing at those.
          create-github-releases: false
          # PRs opened with the default token do not trigger CI, which would leave the required checks on the
          # "Version Packages" PR pending forever. Optionally add a fine-grained PAT (Contents + Pull requests:
          # read/write) as the RELEASE_TOKEN secret; without it, close and reopen the PR to run CI.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # Needed for the first publish only. After configuring trusted publishing on npmjs.com for each
          # package, delete this secret and the line below.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
