name: Changeset check

# Fails a PR that changes a published package (core, node, next) without a changeset, so no change
# silently misses the next release. Docs-only or internal changes: run `pnpm changeset --empty`.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset
    # The release bot's own "Version Packages" PR consumes the changesets, and dependency bumps come from Dependabot.
    if: github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require a changeset for changed packages
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
