name: Desktop release

# Tag a version (git tag v0.1.0 && git push origin v0.1.0) to build the installers for every
# platform and attach them to a GitHub Release. Can also be run by hand to test the builds;
# a manual run uploads the installers as workflow artifacts and does not create a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            files: |
              apps/desktop/release/*.exe
          - name: macOS arm64
            os: macos-latest
            script: dist:mac
            files: |
              apps/desktop/release/*.dmg
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac
            files: |
              apps/desktop/release/*.dmg
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            files: |
              apps/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$app_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop version v$app_version" >&2
            exit 1
          fi

      # Unsigned until signing certificates are configured (see README, "Unsigned builds").
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @tracethrough/desktop ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TraceThrough ${GITHUB_REF_NAME}" \
            --generate-notes
